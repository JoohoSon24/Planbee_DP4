<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Bee · Handoffs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Handoffs · 세 화면
   화면 셋(입력 · 판 · Handoffs)은 모두 같은 틀: 왼쪽 넓은 본문 + 오른쪽 380px 칸
   판: 막대·화살표를 누르면 오른쪽에 자세히 · 일을 옮기는 조작은 배정판의 몫이라 여기엔 없음
   표기: ○ 사람 · ⬢ 그 사람의 프록시 · ⚙ Hive(규칙대로 계산하는 코드) */
:root {
  --bg: #f2f0e9; --surface: #fffdf8; --surface-2: #f7f5ef; --sunken: #ece9e0;
  --ink: #22201a; --ink-2: #4b483f; --muted: #7b776b; --line: #e3dfd3; --line-2: #cdc8b8;
  --honey: #d39410; --honey-soft: #fbf0d3; --honey-ink: #7a5407;
  --brick: #b4533b; --brick-soft: #f5e1d9; --ok: #3f7a5c; --ok-soft: #e1efe6; --on-ink: #fffdf8;
  --shadow: 0 1px 2px rgba(34,32,26,.05), 0 6px 20px rgba(34,32,26,.06);
  --lift: 0 12px 28px rgba(34,32,26,.18);
  --f: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161512; --surface: #1f1d19; --surface-2: #262420; --sunken: #302d27;
    --ink: #efece4; --ink-2: #cfcabd; --muted: #9a9587; --line: #35322c; --line-2: #4c483f;
    --honey: #e9ad3a; --honey-soft: #3a2f17; --honey-ink: #f3d08a; --brick: #e48a72; --brick-soft: #43251d; --ok: #7fc3a0; --ok-soft: #1f3329; --on-ink: #161512;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); --lift: 0 12px 28px rgba(0,0,0,.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161512; --surface: #1f1d19; --surface-2: #262420; --sunken: #302d27;
  --ink: #efece4; --ink-2: #cfcabd; --muted: #9a9587; --line: #35322c; --line-2: #4c483f;
  --honey: #e9ad3a; --honey-soft: #3a2f17; --honey-ink: #f3d08a; --brick: #e48a72; --brick-soft: #43251d; --ok: #7fc3a0; --ok-soft: #1f3329; --on-ink: #161512;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); --lift: 0 12px 28px rgba(0,0,0,.55); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.45;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
[hidden] { display: none !important; }
.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
.hexs { display: inline-block; background: var(--honey); clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); flex: none; }
.pp { display: inline-flex; align-items: center; justify-content: center; flex: none; font-weight: 700; }
.pp.person { width: 26px; height: 26px; border-radius: 50%; background: var(--sunken); color: var(--ink-2); font-size: 11.5px; }
.pp.proxy { width: 26px; height: 26px; background: var(--honey); color: #22201a; font-size: 11px; clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%); }
.pp.hive { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--on-ink); }
.pp.hive .i { width: 13px; height: 13px; }
.pp.sm { width: 20px; height: 20px; font-size: 9.5px; }
.nm-proxy { font-weight: 600; color: var(--honey-ink); }

/* 상단 */
.top { min-height: 58px; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 8px 8px 18px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.brand .hexs { width: 20px; height: 20px; }
.brand small { font-family: var(--mono); font-weight: 500; font-size: 11px; color: var(--muted); }
.tabs { display: flex; gap: 3px; background: var(--sunken); border-radius: 14px; padding: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 10px; min-height: 40px; padding: 0 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: background .2s, color .2s; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tabs .k { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.tabs .k.in { box-shadow: inset 0 0 0 1.5px currentColor; }
.tabs .k.sys { background: var(--honey); color: #22201a; }
.tabs .k.out { background: var(--ink); color: var(--on-ink); }
.badge { min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; font-size: 11px; font-family: var(--mono); display: inline-flex; align-items: center; justify-content: center; background: var(--honey); color: #22201a; }
.badge.red { background: var(--brick); color: var(--on-ink); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--honey); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.grow { flex: 1; }
.now { color: var(--muted); font-size: 13px; }
.ms { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line-2); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; }
.btn { min-height: 38px; border-radius: 999px; border: 0; padding: 0 14px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .15s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.soft { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-2); }
.btn.honey { background: var(--honey); color: #22201a; }
.strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 8px 8px 16px; }
.workflow-progress { padding:14px 18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
.workflow-stages { display:flex; flex-wrap:wrap; gap:8px; }
.workflow-stage { padding:7px 12px; border-radius:9px; background:var(--sunken); color:var(--muted); font-size:13px; }
.workflow-stage.current { background:#e8efff; color:#345bc4; box-shadow:inset 0 0 0 1px #345bc4; font-weight:700; }
.workflow-stage.visited { color:var(--ink); }
.workflow-note { font-size:12px; color:var(--muted); }
.pm-summary { width:100%; border-top:1px solid var(--line-2); padding-top:10px; font-size:13px; }
.pm-summary summary { cursor:pointer; color:var(--ink); font-weight:700; }
.pm-summary-body { max-height:440px; overflow:auto; padding:10px 4px; line-height:1.65; }
.pm-summary-body ul { padding-left:20px; }
.narr { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); flex: 1; min-width: 220px; }
.narr > i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); flex: none; }
.narr.on > i { background: var(--honey); animation: blink 1s infinite; }

.screen { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; align-items: start; }
@media (max-width: 1099px) { .screen { grid-template-columns: minmax(0, 1fr); } }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pn { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ph { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ph h2 { margin: 0; font-size: 15px; }
.ph small { color: var(--muted); font-size: 12.5px; }
.hint { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.seg { display: flex; gap: 2px; background: var(--sunken); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; min-height: 32px; padding: 0 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* 입력 */
.recs { display: flex; flex-direction: column; gap: 6px; }
.rec { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 12px; background: var(--surface-2); font-size: 13px; }
.rec .src { width: 26px; height: 26px; border-radius: 8px; background: var(--surface); display: flex; align-items: center; justify-content: center; flex: none; color: var(--ink-2); }
.rec .tx { flex: 1; min-width: 0; }
.rec .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.rec.old { opacity: .6; } .rec.fresh { background: var(--honey-soft); } .rec.ok { background: var(--ok-soft); }
.rec.pm { background: var(--ink); color: var(--on-ink); } .rec.pm .meta { color: inherit; opacity: .7; } .rec.pm .src { background: transparent; box-shadow: inset 0 0 0 1px currentColor; color: inherit; }
.rules { display: flex; flex-direction: column; gap: 6px; }
.rule { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line-2); font-size: 13px; }
.rule .i { color: var(--muted); }
.rule.granted { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.rule.granted .i { color: inherit; }

/* 판 */
.tlwrap { overflow-x: auto; }
.tl { position: relative; --n: 7; min-width: calc(var(--n) * 96px + 240px); }
.row { display: grid; grid-template-columns: 132px minmax(0, 1fr) 96px; gap: 10px; align-items: center; }
.days { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); text-align: center; padding-bottom: 8px; }
.days .w2 { color: var(--brick); }
.colh { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.tl .row > :first-child { position: sticky; left: 0; z-index: 6; background: var(--surface); align-self: stretch; display: flex; align-items: center; }  /* 가로로 넘겨도 이름은 남는다 */
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.stack { position: relative; width: 38px; height: 34px; flex: none; }
.stack .person { position: absolute; left: 0; top: 2px; }
.stack .proxy { position: absolute; right: -2px; bottom: -3px; width: 17px; height: 17px; font-size: 8.5px; }
.who-t { min-width: 0; flex: 1; line-height: 1.25; }
.who-n { font-weight: 700; font-size: 16px; }
.who-r { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; }
.ld { font-family: var(--mono); color: var(--ink-2); }
.ld.over { color: var(--brick); }
.lane { padding: 6px 0; border-radius: 12px; transition: background .25s, opacity .25s; }
.lane.active { background: var(--honey-soft); }
.lane.active .stack .proxy { animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.25); } }
.lane.dim { opacity: .35; }
.lane.drop-ok { background: var(--surface-2); }
.lane.drop-hover { background: var(--honey-soft); box-shadow: inset 0 0 0 2px var(--honey); }
.track { position: relative; height: 80px; background: linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / calc(100% / var(--n)) 100%; border-radius: 8px; }
.w2zone { position: absolute; top: 0; bottom: 0; left: calc(500% / var(--n)); right: 0; background: repeating-linear-gradient(135deg, var(--brick-soft) 0 6px, transparent 6px 12px); opacity: .5; border-radius: 0 8px 8px 0; }
.capline { position: absolute; top: -10px; bottom: -10px; left: calc(500% / var(--n) - 1px); width: 2.5px; background: var(--ink); opacity: .6; border-radius: 2px; z-index: 1; }
.nowline { position: absolute; top: -18px; bottom: 0; width: 2px; background: var(--honey); z-index: 4; transition: left .6s; pointer-events: none; }
.nowline span { position: absolute; top: 0; left: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--honey-ink); white-space: nowrap; background: var(--surface); padding: 0 3px; border-radius: 4px; }
.bar { position: absolute; top: 9px; height: 62px; left: calc(var(--s) * 100% / var(--n) + 2px); width: calc(var(--d) * 100% / var(--n) - 4px);
  border-radius: 11px; background: var(--surface); border: 1.5px solid var(--line-2); padding: 6px 10px; overflow: hidden; z-index: 2;
  display: flex; flex-direction: column; justify-content: center; font-size: 14px; font-weight: 600; line-height: 1.3; text-align: left; gap: 4px;
  transition: left .5s var(--ease), width .5s var(--ease), border-color .25s, background .25s, opacity .25s, transform .2s var(--ease), box-shadow .2s; }
.bar .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.bar .m { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; position: relative; }
.bar.move { cursor: grab; touch-action: none; }
.bar.move:hover { transform: translateY(-2px); box-shadow: var(--lift); z-index: 3; }
.bar.sel { box-shadow: 0 0 0 2.5px var(--ink); z-index: 3; }
.bar.held { transform: translateY(-4px) rotate(-1.2deg); box-shadow: var(--lift); border-color: var(--honey); background: var(--honey-soft); z-index: 3; }
.bar.done { background: var(--sunken); border-color: transparent; color: var(--muted); }
.bar.new { background: var(--honey-soft); border-color: var(--honey); }
.bar.prop { background: transparent; border: 1.5px dashed var(--honey); color: var(--honey-ink); }
.bar.spill { border-color: var(--brick); }
.bar.moved { opacity: .6; border-style: dashed; }
.bar.fade { opacity: .3; }
.bar.ghost { background: var(--honey-soft); border: 1.5px dashed var(--honey); color: var(--honey-ink); z-index: 1; pointer-events: none; }
.bar .late { position: absolute; top: 0; right: 0; bottom: 0; width: var(--lw); background: repeating-linear-gradient(135deg, var(--honey) 0 5px, transparent 5px 10px); opacity: .5; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.pop { animation: pop .35s ease; }
.arrows { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: visible; }
.hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.ar { fill: none; stroke-width: 2.4; transition: opacity .2s; }
.ar.ok { stroke: var(--ink-2); } .ah.ok { fill: var(--ink-2); }
.ar.done { stroke: var(--line-2); } .ah.done { fill: var(--line-2); }
.ar.risk { stroke: var(--brick); stroke-width: 2.5; } .ah.risk { fill: var(--brick); }
.ar.prop { stroke: var(--honey); stroke-dasharray: 5 4; stroke-width: 2.2; } .ah.prop { fill: var(--honey); }
.ar.agreed { stroke: var(--honey); stroke-width: 2.4; } .ah.agreed { fill: var(--honey); }
.ar.fade, .ah.fade { opacity: .15; }
.ar.hl { stroke-width: 3.2; }
.ar-halo { fill: none; stroke: var(--surface); stroke-width: 6; }
.alabel { position: absolute; z-index: 5; transform: translate(-50%, -50%); font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; white-space: nowrap; pointer-events: none; }
.alabel.risk { background: var(--brick-soft); color: var(--brick); }
.alabel.prop, .alabel.agreed { background: var(--honey-soft); color: var(--honey-ink); }
.ans { font-size: 12px; min-width: 0; }
.ans .idle { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.ans .idle.over { color: var(--brick); }
.bid { display: flex; flex-direction: column; gap: 2px; padding: 5px 6px 5px 8px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.bid .l1 { display: flex; align-items: center; gap: 5px; }
.bid .v { font-family: var(--mono); font-size: 14px; }
.bid .l2 { display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 11px; color: var(--muted); }
.bid .l2 .i { width: 11px; height: 11px; }
.bid .l2 span { display: inline-flex; align-items: center; gap: 3px; }
.bid .warn { color: var(--brick); }
.drop { margin-left: auto; border: 0; border-radius: 999px; background: var(--ink); color: var(--on-ink); min-height: 26px; padding: 0 10px; font-size: 11.5px; font-weight: 600; }
.drop.soft { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.st { font-family: var(--mono); font-size: 10.5px; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.st.ok, .st.fit { background: var(--sunken); color: var(--ink-2); }
.st.done { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }
.st.risk, .st.over { background: var(--brick-soft); color: var(--brick); }
.st.prop { background: transparent; color: var(--honey-ink); box-shadow: inset 0 0 0 1px var(--honey); }
.st.agreed { background: var(--honey-soft); color: var(--honey-ink); }
.st.big { font-size: 12px; padding: 2px 9px; }
.zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.zone { border: 1.5px dashed var(--honey); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; background: var(--surface-2); transition: background .2s; }
.zone.drop-hover { background: var(--honey-soft); }
.zone b { display: block; font-size: 13.5px; }
.zone span { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ink-2); }
.lg.risk { border-color: var(--brick); } .lg.prop { border-top: 2px dashed var(--honey); } .lg.agreed { border-color: var(--honey); }
.drag-float { position: fixed; z-index: 50; pointer-events: none; border-radius: 10px; background: var(--honey-soft); border: 1.5px solid var(--honey); padding: 7px 12px; font-weight: 600; font-size: 13px; color: var(--ink); box-shadow: var(--lift); transform: translate(-50%, -70%) rotate(-3deg); }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--on-ink); border-radius: 10px; padding: 6px 10px; font-size: 12px; max-width: 260px; box-shadow: var(--lift); }
.tip b { display: block; }
.tip span { font-family: var(--mono); font-size: 11px; opacity: .8; }

/* 오간 말 */
.act { display: inline-flex; align-items: center; gap: 3px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); border-radius: 999px; padding: 0 7px 0 5px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.act .i { width: 12px; height: 12px; color: var(--honey-ink); }
.fv { background: var(--surface-2); border-radius: 6px; padding: 0 6px; font-size: 13px; }
.fv.n { font-family: var(--mono); } .fv.tk { font-weight: 600; }
.convo { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; }
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.msg .hd { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.msg .hd .i { width: 11px; height: 11px; color: var(--muted); }
.msg .line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; }
.msg .ev { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); }
.msg .ev .i { width: 12px; height: 12px; }
.msg .q { font-size: 12.5px; color: var(--ink-2); }
.msg .q::before { content: "\201C"; color: var(--honey); margin-right: 2px; }
.msg.hive .line { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.msg.pm { justify-content: flex-end; }
.msg.pm .line { background: var(--ink); color: var(--on-ink); border-radius: 12px 12px 4px 12px; padding: 5px 10px; font-size: 12.5px; }
.msg .body { flex: 1; }
.msg .speech { padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 3px 14px 14px 14px; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
.msg.hive .speech { background: var(--surface-2); color: var(--ink-2); font-size: 12px; border-style: dashed; }

  /* ── Handoffs 화면 ── */

  /* ── 공통 그리기 ── */
  function paintTabs() {
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === S.tab); });
    ["in", "board", "out"].forEach(function (k) { document.getElementById("scr-" + k).hidden = S.tab !== k; });
    var newIn = S.recs.length + S.confirms.length - S.seen + S.pending.length;
    if (S.tab === "in") S.seen = S.recs.length + S.confirms.length;
    document.getElementById("b-in").innerHTML = S.tab !== "in" && newIn > 0 ? '<span class="badge">' + newIn + "</span>" : "";
    document.getElementById("b-board").innerHTML = RUN && S.tab !== "board" ? '<span class="live"></span>' : "";
    var openAsk = S.asks.filter(function (x) { return x.open; }).length, rk = risks(S).length;
    document.getElementById("b-out").innerHTML = openAsk ? '<span class="badge red">' + openAsk + "</span>" : (rk ? '<span class="badge">' + rk + "</span>" : "");

  var LIVE_PROGRESS = null, PLAYBACK_PROGRESS = null;
  function progressHTML() {
    var base = S.workflowProgress || {}, p = PLAYBACK_PROGRESS || LIVE_PROGRESS || base;
    var current = p.current || {id:"01",key:"input",title:"입력·재견적"};
    var demoStep = p.demo_step || S.demoStep;

    var stages = base.stages || [{id:"01",key:"input",title:"입력·재견적"},{id:"02",key:"deadline",title:"기한 회복"},{id:"03",key:"fairness",title:"공정성 협상"}];

      return '<span class="workflow-stage ' + (current.key===stage.key ? 'current' : visited.indexOf(stage.key)>=0 ? 'visited' : '') + '" data-workflow-stage="'+stage.id+'"' + (current.key===stage.key ? ' aria-current="step"' : '') + '>'+stage.id+' '+esc(stage.title)+'</span>';

  }
  function paintStrip() {

    f.disabled = RUN || HOLD || !S.feedLabel;

  function paintAll() {
    paintTabs(); paintStrip(); paintBars();
    if (S.tab === "board") { paintSide(); followArrows(); }
    if (S.tab === "in") paintIn();
    if (S.tab === "out") paintOut();
  }

  /* ── 기록 · 메시지 도우미 ── */
  function pulse(pid, on) { var l = document.getElementById("lane-" + pid); if (l) l.classList.toggle("active", !!on); }
  /* 서버에 한 번 시키고, 새로 오간 말을 하나씩 보여 준 뒤 판을 맞춘다 */
  async function act(method, path, body, opt) {
    if (RUN) return;
    opt = opt || {};
    var sv;
    RUN = true; LIVE_PROGRESS = null; PLAYBACK_PROGRESS = null; paintStrip();
    var polling = true, progressTimer = null;
    function pollProgress() {
      fetch("/workflow/progress").then(function (r) { return r.json(); }).then(function (p) {
        if (polling && p) { LIVE_PROGRESS = p; paintStrip(); }
      }).catch(function () {});
    }
    if (/advance|records|retry|confirmations|asks/.test(path)) progressTimer = setInterval(pollProgress, 600);
    try { sv = await call(method, path, body); }
    catch (e) { polling=false; clearInterval(progressTimer); LIVE_PROGRESS=null; RUN = false; paintAll(); return toast(e.message, true); }
    polling=false; clearInterval(progressTimer); LIVE_PROGRESS=null;
    var from = S.log.length, grown = sv.log.length > from && !opt.instant;
    HOLD = null;
    if (opt.board) { S.tab = "board"; S.side = "log"; }
    adopt(sv, grown ? from : null);
    S.narr = grown ? "프록시들이 주고받는 중" : sv.narr;
    paintAll();
    if (grown) {
      for (var i = from; i < sv.log.length; i++) {
        var m = sv.log[i], who = m.k === "proxy" ? m.from : m.who;
        if (who) pulse(who, true);
        await wait(m.k === "proxy" ? 420 : 300);
        var eventStage = ((sv.workflow_progress || {}).timeline || []).filter(function (t) { return m.id>t.message_after && m.id<=t.message_through; })[0];
        if (eventStage) PLAYBACK_PROGRESS = {current:eventStage.stage,round:eventStage.round,status:"running"};
        S.log = sv.log.slice(0, i + 1); paintTabs(); paintStrip(); if (S.tab === "board") paintSide();
        await wait(380); if (who) pulse(who, false);
      }
      S.narr = sv.narr;
    }
    PLAYBACK_PROGRESS=null;
    var open = S.asks.filter(function (x) { return x.open; })[0];
    if (open) { S.focus = { type: "hand", id: open.hid }; S.side = "detail"; }
    else if (opt.focus) { S.focus = opt.focus; S.side = "detail"; }
    RUN = false; FAST = false; paintAll();
    if (opt.toast) toast(opt.toast);
  }
  function undo() { toast(null); return act("POST", "/undo", null, { instant: true }); }
  var toastT;
  function toast(text, plain) {
    var old = document.getElementById("toast"); if (old) old.remove();
    clearTimeout(toastT); if (!text) return;
    var d = document.createElement("div"); d.className = "toast"; d.id = "toast"; d.innerHTML = "<span>" + esc(text) + "</span>" + (plain ? "" : '<button type="button" data-undo-toast="1">되돌리기</button>'); if (plain) d.style.paddingRight = "16px";
    document.body.appendChild(d); toastT = setTimeout(function () { d.remove(); }, 5000);
  }
  /* ── PM 조작: 옮기기 ── */
  function hold(id) {
    if (RUN) return;
    var t = S.tasks[id]; if (!movable(t)) return;
    HOLD = HOLD === id ? null : id; HOVER = null;
    S.focus = { type: "task", id: id }; if (HOLD) S.tab = "board";
    S.narr = HOLD ? '"' + t.title + '"을 집음 · ' + t.role + " 프록시들이 오른쪽 열에 답함 · 놓을 곳을 고르세요" : "내려놓음";
    paintAll();
  }
  function place(dest) {
    var id = HOLD; if (!id || RUN) return;
    var t = S.tasks[id];
    if (dest === t.who) { HOLD = null; S.narr = "그대로 둠"; return paintAll(); }
    return act("POST", "/tasks/" + id + "/move", { dest: dest, auto_confirm: AUTO },
      { toast: dest === "next" ? "2주차로 미뤘어요" : dest === "cut" ? "이번 제출에서 뺐어요" : P[dest].name + "에게 옮겼어요" });
  }
  function reagree(id) { return act("POST", "/handoffs/" + id + "/reagree", { auto_confirm: AUTO }); }
  function runFeed() { return act("POST", "/demo/advance", { auto_confirm: AUTO }, { board: true }); }
  function runGrant(i) {
    var c = S.asks.filter(function (x) { return x.open; })[0]; if (!c) return;
    S.side = "log";
    return act("POST", "/asks/" + c.id + "/grant", { index: i }, { focus: { type: "hand", id: c.hid } });
  }

  /* ── 입력 ── */
  var drag = null, suppress = false, tipEl = null;
  root.addEventListener("click", function (e) {
    var hit = e.target.closest && e.target.closest(".hit");
    if (hit) { S.focus = { type: "hand", id: hit.getAttribute("data-h") }; S.side = "detail"; return paintAll(); }
    var el = e.target.closest("button"); if (!el || el.disabled) return;
    var d = el.dataset;
    if (d.tab) { S.tab = d.tab; HOLD = null; return paintAll(); }
    if (el.id === "skip") { FAST = true; return; }
    if (el.id === "undo") return undo();
    if (el.id === "goask") { var a = S.asks.filter(function (x) { return x.open; })[0]; if (a) { S.focus = { type: "hand", id: a.hid }; S.side = "detail"; S.tab = "board"; } return paintAll(); }
    if (el.id === "feed") { if (RUN || HOLD) return; return runFeed(); }
    if (el.id === "reset") { if (RUN) return; PEOPLE.forEach(function (p) { pulse(p.id, false); }); toast(null);
      /* 시드를 다시 읽으면 사람 이름 · 역할도 바뀔 수 있어서, 줄 머리까지 새로 그리도록 페이지를 다시 연다 */
      return call("POST", "/reset").then(function () { location.reload(); }).catch(function (e2) { toast(e2.message, true); }); }
    if (d.auto) { AUTO = d.auto === "1"; try { localStorage.setItem("planbee-auto", AUTO ? "1" : "0"); } catch (e2) {} return paintIn(); }
    if (d.card) {
      var cd = S.cards.filter(function (x) { return x.who === d.card; })[0];
      return call("PUT", "/people/" + d.card + "/card", { auto_days: Math.max(0, Math.min(5, cd.auto_days + (+d.delta))) })
        .then(function (sv) { adopt(sv); paintAll(); }).catch(function (e2) { toast(e2.message, true); });
    }
    if (d.reject) {
      var reason = (document.getElementById("rej-reason").value || "").trim();
      var rk = Array.prototype.slice.call(document.querySelectorAll("[data-rejkey]")).filter(function (x) { return x.checked; }).map(function (x) { return x.dataset.rejkey; });
      if (!reason) { document.getElementById("rej-reason").focus(); return toast("거절 이유를 적어 주세요", true); }
      if (!rk.length) return toast("거절할 것을 하나 이상 체크해 주세요", true);
      var rc = S.asks.filter(function (x) { return x.open; })[0];
      S.side = "log";
      return act("POST", "/asks/" + d.reject + "/reject", { reason: reason, keys: rk }, { board: true, focus: rc ? { type: "hand", id: rc.hid } : null });
    }
    if (d.cf) return act("POST", "/confirmations/" + d.cf, { ok: true });
    if (d.rj) return act("POST", "/confirmations/" + d.rj, { ok: false });
    if (d.side) { S.side = d.side; return paintSide(); }
    if (d.rounds) {
      var limit = Number(document.getElementById("round-limit").value);
      if (!Number.isInteger(limit) || limit < 1 || limit > 50) return toast("라운드는 1~50 정수로 입력하세요", true);
      return call("PUT", "/rules/rounds", { max: limit }).then(function (result) { S.maxRounds=result.max; paintIn(); }).catch(function (err) { toast(err.message,true); });
    }
    if (d.pref) { S.pref = d.pref; paintIn(); return call("PUT", "/rules/pref", { choice: d.pref }).catch(function (e2) { toast(e2.message, true); }); }
    if (d.filter) { S.filter = d.filter; return paintOut(); }
    if (d.focusH) { S.focus = { type: "hand", id: d.focusH }; if (S.tab === "board") S.side = "detail"; return paintAll(); }
    if (d.hold) return hold(d.hold);
    if (d.dropTo) return place(d.dropTo);
    if (d.cancel) { HOLD = null; S.narr = "그대로 둠"; return paintAll(); }
    if (d.retry) return act("POST", "/negotiations/" + d.retry + "/retry", {auto_confirm:AUTO}, {board:true});
    if (d.reagree) return reagree(d.reagree);
    if (d.grant) return runGrant(+d.grant);
    if (d.bar) {
      if (suppress) { suppress = false; return; }
      if (HOLD) { if (HOLD === d.bar) { HOLD = null; return paintAll(); } }
      S.focus = { type: "task", id: d.bar }; S.side = "detail"; return paintAll();
    }
  });
  document.body.addEventListener("click", function (e) { var b = e.target.closest && e.target.closest("[data-undo-toast]"); if (b) undo(); });
  document.getElementById("demo").addEventListener("change", function (e) {
    call("POST", "/demo/select", { demo: e.target.value }).then(function () { location.reload(); }).catch(function (err) { toast(err.message, true); });
  });
  root.addEventListener("pointerover", function (e) {
    var b = e.target.closest && e.target.closest("[data-bar]");
    if (!b || HOLD || drag) return;
    if (HOVER !== b.dataset.bar) { HOVER = b.dataset.bar; paintBars(); drawArrows(); }
    var t = S.tasks[HOVER]; if (!t) return;
    if (!tipEl) { tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); }
    var outs = Object.keys(S.hand).filter(function (k) { return S.hand[k].from === HOVER && hState(S.hand[k]) !== "cut"; });
    tipEl.innerHTML = "<b>" + esc(t.title) + "</b><span>" + P[t.who].name + " · " + num(t.d) + "일" + (outs.length ? " · 넘기는 곳 " + outs.map(function (k) { return P[S.tasks[S.hand[k].to].who].name; }).join(", ") : "") + (movable(t) ? " · 끌어서 옮기기" : "") + "</span>";
    var r = b.getBoundingClientRect(); tipEl.style.left = Math.min(window.innerWidth - 270, r.left) + "px"; tipEl.style.top = (r.bottom + 8) + "px"; tipEl.hidden = false;
  });
  root.addEventListener("pointerout", function (e) {
    var b = e.target.closest && e.target.closest("[data-bar]");
    if (!b || (e.relatedTarget && b.contains(e.relatedTarget))) return;
    HOVER = null; if (tipEl) tipEl.hidden = true; if (!drag) { paintBars(); drawArrows(); }
  });
  root.addEventListener("pointerdown", function (e) {
    var b = e.target.closest && e.target.closest("[data-bar]"); if (!b || e.button > 0 || RUN) return;
    if (!movable(S.tasks[b.dataset.bar])) return;
    drag = { id: b.dataset.bar, x: e.clientX, y: e.clientY, on: false, float: null, over: null };
  });
  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    if (!drag.on) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
      drag.on = true; if (tipEl) tipEl.hidden = true; HOVER = null;
      if (HOLD !== drag.id) hold(drag.id);
      var f = document.createElement("div"); f.className = "drag-float"; f.textContent = S.tasks[drag.id].title; document.body.appendChild(f); drag.float = f;
    }
    drag.float.style.left = e.clientX + "px"; drag.float.style.top = e.clientY + "px";
    var t = document.elementFromPoint(e.clientX, e.clientY), z = t && t.closest("[data-drop]");
    if (drag.over && drag.over !== z) drag.over.classList.remove("drop-hover");
    if (z) z.classList.add("drop-hover"); drag.over = z;
  });
  document.addEventListener("pointerup", function () {
    if (!drag) return; var d = drag; drag = null;
    if (!d.on) return;
    suppress = true; setTimeout(function () { suppress = false; }, 0);
    if (d.float) d.float.remove();
    if (d.over) { d.over.classList.remove("drop-hover"); place(d.over.dataset.drop); }
  });
  document.addEventListener("pointercancel", function () { if (drag && drag.float) drag.float.remove(); drag = null; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && HOLD) { HOLD = null; S.narr = "내려놓음"; paintAll(); } });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(drawArrows, 60); });

  paintAll(); /* Backend schedule includes approved leave and completion barriers. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawArrows);
})();
</script>
</body>
</html>
