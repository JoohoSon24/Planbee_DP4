<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시나리오 가이드 · Plan Bee</title><style>
:root{--bg:#f2f0e9;--paper:#fffdf8;--ink:#24251f;--muted:#74766a;--line:#deded1;--gold:#b87b0e;--green:#3e735a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}a{color:inherit}header,main{max-width:1220px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}header a{text-decoration:none;font-weight:750}select,button,input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}select{max-width:65vw}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.hero{padding:40px;background:var(--ink);color:var(--paper);border-radius:24px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#d6ba7b}h1{font-size:clamp(26px,4vw,42px);line-height:1.25;margin:14px 0}h2{font-size:25px;line-height:1.3;margin:8px 0}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0}.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:28px}.stats b{font-size:28px;display:block}.stats span{font-size:13px;color:#c3c5b8}nav{display:flex;gap:6px;flex-wrap:wrap;padding:20px 0;position:sticky;top:0;background:var(--bg);z-index:3}nav a{padding:8px 14px;border-radius:99px;text-decoration:none;border:1px solid var(--line);background:var(--paper);font-size:13px}section{padding:22px 0;scroll-margin-top:80px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:var(--paper);border:1px solid var(--line);padding:22px;border-radius:16px}.badge{display:inline-block;font-size:11px;border-radius:99px;padding:3px 9px;background:#ecebe1;margin:0 5px 6px 0}.badge.ok{background:#e1efe6;color:#2e6849}.badge.warn{background:#f7e0d7;color:#9c452d}.num{font-size:30px;line-height:1;font-weight:750;color:var(--gold);margin-bottom:16px}.card blockquote{border-left:3px solid #d8b66a;margin:14px 0;padding-left:12px;color:#525448}.card dl{display:grid;grid-template-columns:90px 1fr;font-size:13px;gap:7px 12px;margin-bottom:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.board-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.board{min-width:700px}.ruler,.lane{display:grid;grid-template-columns:145px 1fr;border-bottom:1px solid var(--line)}.ruler{font-size:12px;color:var(--muted);padding:10px 16px}.days{display:flex;justify-content:space-between}.lane-name{padding:18px 16px;font-size:13px}.lane-name b{display:block}.track{position:relative;min-height:58px;background:repeating-linear-gradient(to right,transparent,transparent calc(20% - 1px),#eeede5 calc(20% - 1px),#eeede5 20%)}.bar{position:absolute;height:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;border-radius:6px;background:#e9d5a4;color:#534018;font-size:11px;text-decoration:none;padding:3px 7px;min-width:4px}.bar:hover{filter:brightness(.94)}.bar.done{background:#d3e4d8;color:#355944}.milestone-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.milestone{flex:1;min-width:190px;border-left:3px solid var(--gold);background:var(--paper);padding:14px 18px}.milestone b{display:block}.task{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;scroll-margin-top:85px}.task summary{cursor:pointer;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;list-style:none}.task summary::after{content:'＋';color:var(--gold);font-size:22px}.task[open] summary::after{content:'−'}.task summary small{display:block;color:var(--muted);font-weight:400}.task .body{padding:0 22px 22px}.task ul{padding-left:20px}.task .body h4{margin:14px 0 4px;font-size:13px;color:var(--muted)}.notice{background:#e9e8de;border-radius:12px;padding:14px 18px;font-size:13px}.error{color:#9c452d;padding:30px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools input{width:190px}footer{padding:35px 0;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}@media(max-width:650px){header,main{padding:16px}.hero{padding:26px}.section-head{display:block}.tools{margin-top:12px}.task summary{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><a href="/">⬡ Plan Bee <span class="muted">/ 시나리오 가이드</span></a><select id="demo" aria-label="설명할 데모 선택"></select></header>
<main id="content" aria-live="polite"><p class="notice">초기 보드를 불러오고 있습니다…</p></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=v=>'<ul>'+(Array.isArray(v)?v:[v]).filter(Boolean).map(x=>'<li>'+esc(typeof x==='object'?JSON.stringify(x):x)+'</li>').join('')+'</ul>';
let requestId=0;
async function load(id){const request=++requestId;$('content').innerHTML='<p class="notice">초기 보드를 불러오고 있습니다…</p>';try{const r=await fetch('/demos/'+encodeURIComponent(id)+'/scenario-data');if(!r.ok)throw Error('시나리오를 불러올 수 없습니다.');const d=await r.json();if(request!==requestId)return;render(d);document.title=(d.meta.title||id)+' · 시나리오 가이드';history.replaceState(null,'','?demo='+encodeURIComponent(id));}catch(e){if(request===requestId)$('content').innerHTML='<p class="error" role="alert">'+esc(e.message)+'</p>';}}
function render(d){const people=Object.fromEntries(d.people.map(p=>[p.id,p])),name=id=>people[id]?.name||id;const milestones=d.tasks.filter(t=>t.kind==='milestone');
let html='<div class="hero"><div class="eyebrow">Scenario field guide · '+esc(d.id)+'</div><h1>'+esc(d.meta.title||d.id)+'</h1><p>'+esc(d.meta.summary||d.meta.narr||'팀의 초기 업무와 위임 조건을 확인하세요.')+'</p><div class="stats">'+[[d.people.length,'참여자'],[d.tasks.length,'업무'],[milestones.length,'마일스톤'],[d.steps.length,'시연 단계']].map(([n,s])=>'<div><b>'+n+'</b><span>'+s+'</span></div>').join('')+'</div></div>';
html+='<nav aria-label="시나리오 목차"><a href="#steps">진행 순서</a><a href="#board">초기 보드</a><a href="#cards">위임카드</a><a href="#tasks">Task 상세</a></nav><p class="notice">합성 데모의 <b>실행 전 초기 상태</b>입니다. 현재 실행 중인 배분을 변경하지 않습니다. 위임카드 원문은 데모 이해용이며, 협상 LLM에는 본인의 카드만 전달됩니다.</p>';
html+='<section id="steps"><div class="section-head"><div><span class="eyebrow">01 · Walkthrough</span><h2>브라우저 시연 단계</h2></div><span class="muted">시연 순서와 협상 라운드는 별개입니다</span></div><div class="grid">'+d.steps.map((s,i)=>'<article class="card"><div class="num">'+String(i+1).padStart(2,'0')+'</div><h3>'+esc(s.label||s.id)+'</h3><p>'+esc(s.narr||'')+'</p>'+list((s.records||[]).map(r=>name(r.who)+' · '+r.text))+'</article>').join('')+'</div></section>';
html+='<section id="board"><div class="section-head"><div><span class="eyebrow">02 · Initial schedule</span><h2>초기 milestone 보드</h2></div><span class="muted">업무 막대를 누르면 상세로 이동합니다</span></div><div class="milestone-list">'+milestones.map(t=>'<div class="milestone"><span class="muted">◆ '+esc(t.end_label)+'</span><b>'+esc(t.title)+'</b><small>'+esc(name(t.who))+'</small></div>').join('')+'</div><div class="board-wrap"><div class="board"><div class="ruler"><span>담당자 / 실제 일정</span><div class="days"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>마감</span></div></div>';
const horizon=Math.max(d.week_end,...d.tasks.map(t=>t.end));
for(const p of d.people){const ts=d.tasks.filter(t=>t.who===p.id&&t.kind!=='milestone');html+='<div class="lane"><div class="lane-name"><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.role)+' · '+p.load+'/'+p.capacity+'일</span></div><div class="track" style="height:'+Math.max(58,ts.length*32+14)+'px">'+ts.map((t,i)=>'<a class="bar '+(t.kind==='done'?'done':'')+'" href="#task-'+esc(t.id)+'" title="'+esc(t.title+' · '+t.start_label+' → '+t.end_label)+'" style="left:'+Math.max(0,t.start/horizon*100)+'%;width:'+Math.max(1,t.d/horizon*100)+'%;top:'+(i*32+8)+'px">'+esc(t.title)+'</a>').join('')+'</div></div>';}
html+='</div></div><p class="muted">기한 '+esc(d.meta.deadline_label||'금요일')+' · Handoff '+d.handoffs.length+'개 · 업무량은 Hive 계산 기준</p><div class="grid">'+d.handoffs.filter(h=>d.tasks.find(t=>t.id===h.to_task)?.kind==='milestone').map(h=>'<div class="card"><span class="badge '+(h.state==='risk'?'warn':'ok')+'">'+(h.state==='risk'?'마감 위험':'초기 일정')+'</span><h3>'+esc(h.title)+'</h3><p class="muted">'+esc(name(d.tasks.find(t=>t.id===h.from_task)?.who))+' → '+esc(name(d.tasks.find(t=>t.id===h.to_task)?.who))+'</p><p>약속 '+esc(h.deadline_label)+'</p></div>').join('')+'</div></section>';
html+='<section id="cards"><div class="section-head"><div><span class="eyebrow">03 · Delegation settings</span><h2>각자의 위임카드</h2></div></div><div class="grid">'+d.people.map(p=>{const c=p.card,pol=c.policy||{};return '<article class="card"><span class="badge">'+esc(p.role)+'</span><h3>'+esc(p.name)+' <small class="muted">'+esc(p.id)+'</small></h3><blockquote>'+esc(c.note||'추가 메모 없음')+'</blockquote><dl><dt>자동 수락</dt><dd>'+esc(c.auto_days??1)+'일까지</dd><dt>수신 지연</dt><dd>'+esc(c.wait_days??0)+'일까지</dd><dt>거절 태그</dt><dd>'+esc((c.refuse_tags||[]).join(', ')||'없음')+'</dd><dt>도움 제공</dt><dd>'+(c.gives_help===false?'불가':'가능')+'</dd><dt>부재 구간</dt><dd>'+esc((pol.unavailable||[]).map(w=>w.start+'일 ~ '+w.end+'일').join(', ')||'없음')+'</dd><dt>현재 업무량</dt><dd>'+p.load+' / '+p.capacity+'일</dd></dl></article>';}).join('')+'</div></section>';
html+='<section id="tasks"><div class="section-head"><div><span class="eyebrow">04 · Work breakdown</span><h2>각 Task 세부 description</h2></div><div class="tools"><input id="search" placeholder="업무·담당자 검색" aria-label="Task 검색"><button id="expand">모두 펼치기</button></div></div>'+d.tasks.map(t=>{const c=t.context||{},links=d.handoffs.filter(h=>h.from_task===t.id||h.to_task===t.id);return '<details class="task" id="task-'+esc(t.id)+'" data-search="'+esc(t.title+' '+name(t.who)+' '+t.id)+'"><summary><div><b>'+esc(t.title)+'</b><small>'+esc(name(t.who))+' · '+t.d+'일 · '+esc(t.start_label)+' → '+esc(t.end_label)+'</small></div><span class="badge">'+esc(t.kind==='milestone'?'마일스톤':t.tag)+'</span></summary><div class="body"><span class="muted">'+esc(t.id)+'</span><p>'+esc(c.description||t.title)+'</p>'+[['목적',c.purpose],['산출물',c.deliverable],['분리 경계',c.split_boundary],['관련 파일',c.files]].filter(x=>x[1]).map(([k,v])=>'<h4>'+k+'</h4>'+list(v)).join('')+(c.acceptance?'<h4>완료 기준</h4>'+list(c.acceptance):'')+'<h4>인수인계와 의존 관계</h4>'+list(links.map(h=>h.title+' · '+(h.from_task===t.id?'전달':'수신')+' · 약속 '+h.deadline_label))+'</div></details>';}).join('')+'<p id="no-match" hidden class="notice">검색 결과가 없습니다.</p></section><footer><a href="/demos/'+encodeURIComponent(d.id)+'/scenario">원문 설명 보기</a> · <a href="/">실행 화면으로 돌아가기</a></footer>';
if(d.meta.engine_support)html='<section class="notice"><strong>실행 지원 범위</strong><p>'+esc(d.meta.engine_support)+'</p><p>'+esc(d.meta.normalization_note||'')+'</p><a href="/demos/'+encodeURIComponent(d.id)+'/board" target="_blank" rel="noopener">원본 일정 이미지 보기</a></section>'+html;
$('content').innerHTML=html;$('search').oninput=e=>{let count=0;document.querySelectorAll('.task').forEach(t=>{t.hidden=!t.dataset.search.toLowerCase().includes(e.target.value.toLowerCase());if(!t.hidden)count++;});$('no-match').hidden=!!count;};$('expand').onclick=()=>{const tasks=[...document.querySelectorAll('.task:not([hidden])')],open=tasks.some(t=>!t.open);tasks.forEach(t=>t.open=open);$('expand').textContent=open?'모두 접기':'모두 펼치기';};document.querySelectorAll('.bar').forEach(a=>a.onclick=()=>{const t=document.getElementById(decodeURIComponent(a.hash.slice(1)));if(t)t.open=true;});}
fetch('/demos').then(r=>{if(!r.ok)throw Error('데모 목록을 불러올 수 없습니다.');return r.json();}).then(d=>{const selected=new URLSearchParams(location.search).get('demo')||d.current;$('demo').innerHTML=d.catalog.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.title)+'</option>').join('');$('demo').value=selected;$('demo').onchange=e=>load(e.target.value);load(selected);}).catch(e=>$('content').innerHTML='<p class="error" role="alert">'+esc(e.message)+'</p>');
</script><script src="/front/english-display.js?v=20261124-en"></script></body></html>
