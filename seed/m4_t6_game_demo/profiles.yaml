# Display-only profiles for the board's person, task and Handoff details.
# Source: "M4 시연용 시나리오" (Senario/), sections 2 (사람 스키마), 3 (Task 스키마) and 3.1 (추가 제약).
# Not sent to any LLM call. Agent prompts keep using team.yaml cards and task contracts.
people:
  mia:
    role: 그림 중심
    skills: {art: 능숙, ui: 가능}
    takes: 아트, UI
    refuses: 서버, QA, 게임플레이
    limit: 0.5일까지 프록시 수락 · P0 기한 변경은 직접 확인
    wish: 이펙트 완성
  leo:
    role: 게임플레이 중심
    skills: {game: 능숙}
    takes: 보스 AI, 게임플레이 연결, 데모 빌드
    refuses: 아트, 서버, UI, 독립 QA
    limit: 0.5일까지 프록시 수락 · 임시 아트로 연결할 때는 직접 확인
    wish: 없음
  sam:
    role: 서버 중심
    skills: {server: 능숙, ui: 가능, test: 가능}
    takes: 서버, 저장
    refuses: 그림, 게임플레이 · 테스트는 받는 일 밖
    limit: 1일까지 프록시 수락(받는 일에 한함) · QA 대행은 본인 동의
    wish: 없음
  ben:
    role: UI·레벨 중심
    skills: {ui: 능숙, level: 능숙, test: 가능}
    takes: UI, 레벨, 스모크 QA
    refuses: 서버, 아트, 보스 게임플레이
    limit: 1일까지 프록시 수락 · P0 소유권 변경은 직접 확인
    wish: 레벨 완성
  zoe:
    role: 테스트 중심
    skills: {test: 능숙, ui: 가능}
    takes: 테스트
    refuses: 서버, 아트, 게임플레이 구현
    limit: 0.5일까지 프록시 수락 · 최종 회귀 서명은 직접
    wish: QA 품질 유지
tasks:
  A1: {kind: art, start: 없음, pieces: [러프 0.5일, 최종 0.5일], fixed: 최종 보스 그림, note: 러프 기반 임시 연동은 Leo가 직접 승인할 때만 가능}
  A2: {kind: art, start: A1 완료, fixed: 없음 · P1이므로 연기·제외 가능}
  G1: {kind: game, start: 없음, fixed: 보스 기본 동작}
  G2: {kind: game, start: A1 최종 + G1 완료, pieces: [임시 연동 0.5일 (조건부), 최종 아트 반영 0.5일], fixed: 최종 아트 반영과 작동 확인}
  G3: {kind: game, start: G2 · S2 · B1 · Q2 최종 승인 완료, fixed: 금 16시까지 유효한 P0 빌드}
  S1: {kind: server, start: 없음, fixed: 저장 동작}
  S2: {kind: server, start: S1 완료, fixed: P0 데모 환경 정상 배포}
  S3: {kind: server, start: S2 완료, pieces: [통째 1일 이동만 가능], fixed: 없음 · 기본 feature flag OFF, P0 빌드와 독립}
  B1: {kind: level, start: 월요일 스테이지3 배경 완료, fixed: 플레이 가능한 스테이지3}
  B2: {kind: ui, start: B1 완료, pieces: [통째 1일 이동만 가능], fixed: 없음 · P0 데모 필수 아님}
  Q1: {kind: test, start: 스테이지1·2 구현 완료, fixed: 스테이지1·2 QA 완료}
  Q2: {kind: test, start: G2 · S2 · B1 · Q1 완료, pieces: [목 오후 스모크 0.5일, 금 오전 최종 회귀 0.5일], fixed: 총 1일 QA · Zoe 최종 회귀와 서명, note: 스모크 담당자는 바꿀 수 있음}
handoffs:
  h_A1_A2: {what: 보스 그림 최종본}
  h_A1_G2: {what: 보스 그림 최종본}
  h_G1_G2: {what: 보스 AI}
  h_S1_S2: {what: 저장 기능}
  h_S2_S3: {what: 배포된 서버}
  h_B1_B2: {what: 스테이지3 배치}
  h_G2_Q2: {what: 연결된 보스전}
  h_S2_Q2: {what: 배포된 서버}
  h_B1_Q2: {what: 스테이지3 배치}
  h_Q1_Q2: {what: 스테이지1·2 테스트 결과}
  h_G2_G3: {what: 연결된 보스전}
  h_S2_G3: {what: 배포된 서버}
  h_B1_G3: {what: 스테이지3 배치}
  h_Q2_G3: {what: 통합 QA 최종 승인}
  h_G3_milestone: {what: 데모 빌드}
