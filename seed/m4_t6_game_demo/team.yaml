meta:
  title: T6 · Game Demo · 5인 게임 데모 협상
  summary: '5명·12개 Task, 11/27 17:00 데모. 기본: Zoe 목요일 오후 부재와 Q2 분담.'
  phase: issue
  now: 1.5
  week_start: '2026-11-23'
  deadline_label: 11/27 17:00 데모
  source_task: Q2
  source: 제공된 M4 시연용 시나리오 export
  source_sha256: 14cd2c15349d50ea1904e08c51830ec7cf17b17b1db64fb0dd661fdc8c021e72
  engine_support: 5명·12개 원 업무와 데모 milestone을 연결합니다. 기본 예시는 Zoe 목요일 오후 부재를 반영한 Q2 스모크/최종
    회귀 분담입니다. 스모크 0.5일과 Zoe 최종 회귀 0.5일, 전체 1일 QA와 빌드 선행조건을 코드로 보존합니다. Ben 또는 Sam에게
    P0 스모크를 넘기면 본인 확인을 요청합니다. T4의 알고리즘 자동 동의는 T6에 적용하지 않습니다. 현재 V2는 PM 최종 선택을 요구하므로
    원문의 H04 PM 0회 경로와 다릅니다. 신규 상점 Task 생성·교체와 작성자 진행률 동기화 전용 경로는 아직 구현되지 않았으며 원문 기대
    사례로 구분합니다. Sam 대안은 S3 전체 1일을 금요일로 옮겨 목요일 오후 스모크 슬롯을 확보하며 QA 예외와 일정 변경을 묶어 Sam
    본인 확인을 요구합니다.
  normalization_note: 시간축은 2026-11-23 월요일=0, 화요일 13:00=1.5, 금요일 17:00=5입니다. Task d는
    기준 시각 이후 남은 시간이며 진행률은 원문의 작성자 추정값을 별도 보존합니다. 공통 초기 보드에 기본 H04의 Zoe 목요일 오후 부재를
    가용 시간 제약으로 반영했으므로 기존 Q2 배정은 기한 위험 상태입니다. 원문 G3의 금요일 오후 0.5일은 13:00~17:00이지만 16:00
    유효 빌드 조건과 충돌합니다. 현재 실행은 공통 데모 마감 17:00을 적용하고 16:00 조건은 미확정 원문 조건으로 보존하며, 이를 충족했다고
    주장하지 않습니다. 숙련도는 원문 문자열로 보존하고 과거 실적 건수를 만들어 넣지 않습니다.
  narr: 제가 목요일 오후 Q2 통합 QA 스모크를 진행할 수 없습니다. 금요일 오전 최종 회귀와 서명은 제가 담당하겠습니다. Ben·Leo와
    스모크 분담과 데모 빌드 일정을 조정해 주세요.
