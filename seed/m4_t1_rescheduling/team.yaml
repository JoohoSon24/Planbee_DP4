meta:
  title: T1 · Simple Rescheduling · 일정 이동
  summary: Polish 작업을 하루 뒤인 11/23으로 이동하고 싶습니다. Bug Fix와 Core X 일정은 그대로 유지하고 싶습니다.
    Polish 소요량은 6h 그대로입니다.
  phase: issue
  now: 4
  week_start: '2026-11-16'
  deadline_label: 11/27 Alpha
  narr: 다음 시나리오 이슈를 눌러 원문의 변경 요청을 처리하세요.
  source_task: polish
  source: Senario/M4 시나리오 설계
  source_sha256: b792bc750331879c54a5ee8b941eca14588c7da92718618d4c846499ac696d4f
  engine_support: Dev 단독으로 일정 이동 후보를 평가하며 GD·Art·QA LLM을 불필요하게 호출하지 않습니다. Hive가 제약을
    검증합니다. 공통 V2 정책상 최종 적용에는 PM 선택이 필요합니다. 원안의 단독 자동 처리와는 다릅니다.
  normalization_note: 원문 이미지의 막대 위치와 시간 길이가 맞지 않는 곳은 본문 시간(h)을 우선했습니다. T1은 11/23 가용
    8h 조건에 따라 Bug Fix를 11/24 시작으로 고정하고 Final Test는 11/26~27로 정규화했습니다. T5 초기 보드에는 새로
    발견된 잔여 수정 16h를 표시합니다.
