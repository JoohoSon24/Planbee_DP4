meta:
  title: T4 · Composite Negotiation · 복합 협상
  summary: Character Animation은 기존 24h에서 32h(4일)로 증가해 11/20 가용 8h를 추가 사용합니다. FX Assets
    잔여 4h는 11/23 오전에 수행해 12:00 전달 가능합니다. 임시 에셋은 11/20 제공 가능합니다. Dev·QA와 조정하고 싶습니다.
  phase: issue
  now: 4
  week_start: '2026-11-16'
  deadline_label: 11/26 Alpha
  narr: 다음 시나리오 이슈를 눌러 원문의 변경 요청을 처리하세요.
  source_task: character_animation
  source: Senario/M4 시나리오 설계
  source_sha256: b792bc750331879c54a5ee8b941eca14588c7da92718618d4c846499ac696d4f
  engine_support: 임시 Integration과 최종 교체의 단계별 분해, 선행 FX의 최종 교체 연결, 선택 Retest의 동일 항목
    Final QA 포함을 검증합니다. Retest 생략 후보에는 QA 본인 Confirm이 필요합니다. 월요일에 두 Integration 단계를
    모두 끝내면 Retest 유지도 가능하므로 생략을 정답으로 강제하지 않습니다. V2 공통 정책상 적용에는 PM 최종 선택이 필요합니다.
  normalization_note: 원문 이미지의 막대 위치와 시간 길이가 맞지 않는 곳은 본문 시간(h)을 우선했습니다. T1은 11/23 가용
    8h 조건에 따라 Bug Fix를 11/24 시작으로 고정하고 Final Test는 11/26~27로 정규화했습니다. T5 초기 보드에는 새로
    발견된 잔여 수정 16h를 표시합니다.
