meta:
  title: T2 · Task Reallocation · 업무 재분배
  summary: UI Integration 작업에 예상보다 하루가 더 필요합니다. 기존 8h에서 총 16h(2일)로 증가했습니다. 로직 연결 8h는
    Dev 전담, 에셋 연결 8h는 Art에게 분담 가능합니다. Bug Fix는 예정대로 끝내야 합니다. 작업의 재분배를 요청합니다.
  phase: issue
  now: 5
  week_start: '2026-11-16'
  deadline_label: 11/26 Alpha
  narr: 다음 시나리오 이슈를 눌러 원문의 변경 요청을 처리하세요.
  source_task: ui_integration
  source: Senario/M4 시나리오 설계
  source_sha256: b792bc750331879c54a5ee8b941eca14588c7da92718618d4c846499ac696d4f
  engine_support: Task에 명시된 로직/에셋 범위와 담당 권한을 검증하여 Dev·Art 분담을 지원합니다. Art 본인 Confirm과
    PM 선택 후 적용합니다.
  normalization_note: 원문 이미지의 막대 위치와 시간 길이가 맞지 않는 곳은 본문 시간(h)을 우선했습니다. T1은 11/23 가용
    8h 조건에 따라 Bug Fix를 11/24 시작으로 고정하고 Final Test는 11/26~27로 정규화했습니다. T5 초기 보드에는 새로
    발견된 잔여 수정 16h를 표시합니다.
